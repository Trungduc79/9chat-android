name: Android Release

# Autodeploy Android (tự-host):
#   push main → build APK đã ký → scp lên 9chat.vn/app/ + ghi version.json
#   → app đang chạy mở lên tự thấy bản mới (in-app updater) → nhắc cài.
#
# Secrets cần khai (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 của 9chat-release.jks
#   KEYSTORE_PASSWORD  mật khẩu store
#   KEY_ALIAS          alias key (9chat)
#   KEY_PASSWORD       mật khẩu key
#   VAPI_API_KEY       key vapi embed vào app (như local.properties)
#   VPS_HOST           103.170.123.106
#   VPS_SSH_KEY        private key SSH có quyền ghi /www/wwwroot/9chat.vn/app/

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-release.yml'
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/9chat-release.jks"

      - name: Inject VAPI key
        run: echo "VAPI_API_KEY=${{ secrets.VAPI_API_KEY }}" >> local.properties

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/9chat-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PverCode=${{ github.run_number }} \
            -PverName=1.0.${{ github.run_number }}

      - name: Write version.json
        run: |
          cat > version.json <<EOF
          {
            "versionCode": ${{ github.run_number }},
            "versionName": "1.0.${{ github.run_number }}",
            "apkUrl": "https://9chat.vn/app/9chat-${{ github.run_number }}.apk",
            "notes": "Đã có bản cập nhật mới. Nhấn Cập nhật để cài.",
            "mandatory": false
          }
          EOF

      - name: Deploy APK + manifest to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes root@$VPS_HOST"
          APK=app/build/outputs/apk/release/app-release.apk
          $SSH 'mkdir -p /www/wwwroot/9chat.vn/app'
          scp -i ~/.ssh/id_deploy "$APK" \
            root@"$VPS_HOST":/www/wwwroot/9chat.vn/app/9chat-${{ github.run_number }}.apk
          # Ghi version.json SAU khi APK đã lên → app không trỏ tới file chưa tồn tại.
          scp -i ~/.ssh/id_deploy version.json \
            root@"$VPS_HOST":/www/wwwroot/9chat.vn/app/version.json
          $SSH 'chown -R www:www /www/wwwroot/9chat.vn/app'
